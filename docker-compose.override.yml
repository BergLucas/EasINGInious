name: easinginious-dev

services:
  app:
    image: easinginious:0.9.2-dev
    pull_policy: never
    build:
      context: .
      target: development
    command: >
      sh -c "poetry run easinginious updatedb &&
             poetry run inginious-webapp"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
        - action: restart
          path: pyproject.toml
    ports:
      - 127.0.0.1:8000:8000
      - ::1:8000:8000

  db:
    ports:
      - 127.0.0.1:27017:27017
      - ::1:27017:27017
